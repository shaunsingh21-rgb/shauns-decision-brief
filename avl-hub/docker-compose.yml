# AVL Tech Hub: the app + Caddy (which gets and renews the HTTPS certificate automatically).
# Needs a .env file next to this one (copy .env.example) with at least DOMAIN=hub.yourorg.edu
services:
  app:
    build: .
    init: true                  # a proper PID 1, so `docker compose stop` shuts the app down cleanly instead of waiting and killing it
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      DB_PATH: /data/avl-hub.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes:
      - avl-data:/data
    expose: ["3000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (for example hub.yourorg.edu)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  backup:
    # Runs the nightly backup at 02:15 server time. Backups land in the same data volume under /data/backups;
    # set BACKUP_COPY_TO (in .env) to ALSO copy each one somewhere else, and copy that off the machine.
    build: .
    init: true
    restart: unless-stopped
    healthcheck: { disable: true }   # this container runs no web server, so the image's web health check does not apply
    env_file: .env
    environment: { DB_PATH: /data/avl-hub.db, UPLOAD_DIR: /data/uploads, BACKUP_DIR: /data/backups }
    volumes:
      - avl-data:/data
      - ${OFFSITE_DIR:-./offsite}:/offsite      # set BACKUP_COPY_TO=/offsite in .env: each night's backup is ALSO copied to this folder on the server (point OFFSITE_DIR at a mounted share)
    entrypoint: ["sh", "-c", "while true; do now=$$(date +%s); next=$$(date -d 'today 02:15' +%s); [ $$next -le $$now ] && next=$$(date -d 'tomorrow 02:15' +%s); sleep $$((next-now)); node scripts/backup.js || echo BACKUP-FAILED; done"]
volumes:
  avl-data:
  caddy-data:
  caddy-config:
